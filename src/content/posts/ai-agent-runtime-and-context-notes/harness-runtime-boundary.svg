<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Harness 与 Agent Runtime 的职责边界</title>
  <desc id="desc">Harness 是 Agent 边界内的运行与治理层，Runtime 是其中负责模型调用、工具执行、状态、沙箱和日志的执行基础。</desc>
  <defs>
    <style>
      .title{font:700 28px system-ui,'Microsoft YaHei',sans-serif;fill:#172033}.heading{font:700 21px system-ui,'Microsoft YaHei',sans-serif;fill:#21304a}.body{font:16px system-ui,'Microsoft YaHei',sans-serif;fill:#344054}.small{font:14px system-ui,'Microsoft YaHei',sans-serif;fill:#667085}.label{font:700 16px system-ui,'Microsoft YaHei',sans-serif;fill:#1f4b7a}.agent{fill:#fbfcfd;stroke:#52789d;stroke-width:2}.box{fill:#fff;stroke:#98a2b3;stroke-width:1.5}.blue{fill:#eef5fb;stroke:#52789d;stroke-width:1.7}.runtime{fill:#f5f7fa;stroke:#667085;stroke-width:1.7}.env{fill:#fff;stroke:#667085;stroke-width:1.5;stroke-dasharray:7 5}.arrow{stroke:#52789d;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#52789d"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="55" y="58" class="title">Harness 与 Runtime：同一系统中的两个职责层次</text>
  <line x1="55" y1="78" x2="1145" y2="78" stroke="#21304a" stroke-width="1.5"/>

  <rect class="agent" x="55" y="110" width="875" height="555" rx="10"/>
  <text x="80" y="145" class="heading">Agent 边界</text>

  <rect class="blue" x="85" y="220" width="220" height="190" rx="8"/>
  <text x="195" y="262" class="heading" text-anchor="middle">Model</text>
  <text x="195" y="299" class="body" text-anchor="middle">理解上下文</text>
  <text x="195" y="329" class="body" text-anchor="middle">推理与选择行动</text>
  <text x="195" y="371" class="small" text-anchor="middle">输出：decision / tool call</text>

  <rect class="box" x="365" y="165" width="530" height="455" rx="9"/>
  <text x="630" y="202" class="heading" text-anchor="middle">Harness：运行与治理层</text>

  <text x="395" y="246" class="label">控制与治理</text>
  <g transform="translate(395 265)">
    <rect class="blue" x="0" y="0" width="145" height="62" rx="6"/><text x="72" y="27" class="body" text-anchor="middle">Context</text><text x="72" y="49" class="small" text-anchor="middle">上下文管理</text>
    <rect class="blue" x="165" y="0" width="145" height="62" rx="6"/><text x="237" y="27" class="body" text-anchor="middle">Agent Loop</text><text x="237" y="49" class="small" text-anchor="middle">推进与停止</text>
    <rect class="blue" x="330" y="0" width="145" height="62" rx="6"/><text x="402" y="27" class="body" text-anchor="middle">Policy</text><text x="402" y="49" class="small" text-anchor="middle">约束与授权</text>
    <rect class="blue" x="82" y="82" width="145" height="62" rx="6"/><text x="154" y="109" class="body" text-anchor="middle">Verifier</text><text x="154" y="131" class="small" text-anchor="middle">验证证据</text>
    <rect class="blue" x="247" y="82" width="145" height="62" rx="6"/><text x="319" y="109" class="body" text-anchor="middle">Recovery</text><text x="319" y="131" class="small" text-anchor="middle">纠正与恢复</text>
  </g>

  <line x1="395" y1="430" x2="865" y2="430" stroke="#d0d5dd"/>
  <text x="395" y="462" class="label">Agent Runtime：执行基础</text>
  <g transform="translate(395 480)">
    <rect class="runtime" x="0" y="0" width="145" height="62" rx="6"/><text x="72" y="27" class="body" text-anchor="middle">Model Gateway</text><text x="72" y="49" class="small" text-anchor="middle">API / 流式响应</text>
    <rect class="runtime" x="165" y="0" width="145" height="62" rx="6"/><text x="237" y="27" class="body" text-anchor="middle">Tool Executor</text><text x="237" y="49" class="small" text-anchor="middle">真实执行</text>
    <rect class="runtime" x="330" y="0" width="145" height="62" rx="6"/><text x="402" y="27" class="body" text-anchor="middle">State Store</text><text x="402" y="49" class="small" text-anchor="middle">Session / Status</text>
    <text x="237" y="91" class="small" text-anchor="middle">Sandbox · Timeout · Retry · Logging · Cost</text>
  </g>

  <path class="arrow" d="M305 285H365"/>
  <path class="arrow" d="M365 350H305"/>

  <rect class="env" x="975" y="205" width="170" height="330" rx="8"/>
  <text x="1060" y="244" class="heading" text-anchor="middle">Environment</text>
  <text x="1060" y="292" class="body" text-anchor="middle">项目文件</text>
  <text x="1060" y="328" class="body" text-anchor="middle">Shell / 进程</text>
  <text x="1060" y="364" class="body" text-anchor="middle">网页 / API</text>
  <text x="1060" y="400" class="body" text-anchor="middle">数据库</text>
  <text x="1060" y="436" class="body" text-anchor="middle">用户与外部世界</text>
  <path class="arrow" d="M895 500H975"/>
  <path class="arrow" d="M975 550H895"/>

  <line x1="55" y1="696" x2="1145" y2="696" stroke="#d0d5dd"/>
  <text x="55" y="728" class="small">术语约定：Harness 是更宽的控制与治理边界；Runtime 是其中把模型、工具和状态真正运行起来的执行底座。具体产品的命名可能不同。</text>
</svg>
