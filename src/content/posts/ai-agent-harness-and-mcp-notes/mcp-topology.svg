<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MCP 与原生工具的连接关系</title>
  <desc id="desc">Harness 内的工具注册表同时包含原生工具和 MCP 工具。每个 MCP Client 连接一个本地或远程 MCP Server。</desc>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#486581"/></marker>
    <style>
      .t{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#1f2933}.h{font-size:25px;font-weight:700}.m{font-size:19px;font-weight:600}.s{font-size:15px;fill:#52616b}.box{fill:#fff;stroke:#8496a3;stroke-width:2}.soft{fill:#f1f5f7;stroke:#8496a3;stroke-width:2}.blue{fill:#edf3f7;stroke:#486581;stroke-width:2}.line{stroke:#486581;stroke-width:2.4;fill:none;marker-end:url(#ar)}.dash{stroke:#6b7c85;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#ar)}
    </style>
  </defs>
  <rect width="1200" height="700" rx="18" fill="#fbfbfa" stroke="#d5dadd"/>
  <text class="t h" x="600" y="45" text-anchor="middle">MCP 是外部能力的标准接入方式，不是所有工具的必经层</text>

  <rect class="soft" x="55" y="85" width="560" height="545" rx="12"/>
  <text class="t h" x="85" y="126">MCP Host / Agent Harness</text>
  <rect class="blue" x="95" y="163" width="205" height="76" rx="8"/>
  <text class="t m" x="197" y="194" text-anchor="middle">LLM</text><text class="t s" x="197" y="220" text-anchor="middle">选择工具与参数</text>
  <rect class="box" x="367" y="163" width="205" height="76" rx="8"/>
  <text class="t m" x="469" y="194" text-anchor="middle">统一工具注册表</text><text class="t s" x="469" y="220" text-anchor="middle">汇总各来源的工具定义</text>
  <path class="line" d="M305 201H358"/>

  <rect class="box" x="95" y="301" width="205" height="115" rx="8"/>
  <text class="t m" x="197" y="337" text-anchor="middle">原生工具</text>
  <text class="t s" x="197" y="366" text-anchor="middle">shell · read/write file</text>
  <text class="t s" x="197" y="391" text-anchor="middle">直接由 Harness 调度</text>
  <path class="line" d="M410 244L260 293"/>

  <rect class="blue" x="367" y="301" width="205" height="82" rx="8"/>
  <text class="t m" x="469" y="334" text-anchor="middle">MCP Client A</text><text class="t s" x="469" y="360" text-anchor="middle">一条专用连接</text>
  <rect class="blue" x="367" y="430" width="205" height="82" rx="8"/>
  <text class="t m" x="469" y="463" text-anchor="middle">MCP Client B</text><text class="t s" x="469" y="489" text-anchor="middle">另一条专用连接</text>
  <path class="line" d="M470 245V292"/>
  <path class="line" d="M522 245V421"/>
  <rect class="box" x="95" y="548" width="477" height="48" rx="7"/>
  <text class="t s" x="333" y="578" text-anchor="middle">Host 负责授权、用户确认、上下文与安全边界</text>

  <rect class="box" x="705" y="120" width="440" height="210" rx="12"/>
  <text class="t h" x="740" y="162">本地 MCP Server</text>
  <text class="t s" x="740" y="191">本机独立进程 · 常用 STDIO</text>
  <rect class="soft" x="745" y="225" width="160" height="65" rx="7"/>
  <text class="t m" x="825" y="264" text-anchor="middle">文件系统</text>
  <rect class="soft" x="945" y="225" width="160" height="65" rx="7"/>
  <text class="t m" x="1025" y="264" text-anchor="middle">本地数据库</text>

  <rect class="box" x="705" y="390" width="440" height="210" rx="12"/>
  <text class="t h" x="740" y="432">远程 MCP Server</text>
  <text class="t s" x="740" y="461">互联网或公司内网 · Streamable HTTP</text>
  <rect class="soft" x="745" y="495" width="160" height="65" rx="7"/>
  <text class="t m" x="825" y="534" text-anchor="middle">GitHub / Jira</text>
  <rect class="soft" x="945" y="495" width="160" height="65" rx="7"/>
  <text class="t m" x="1025" y="534" text-anchor="middle">SaaS / 企业系统</text>

  <path class="line" d="M577 342C650 342 650 225 695 225"/>
  <text class="t s" x="647" y="270" text-anchor="middle">tools/list</text>
  <text class="t s" x="647" y="293" text-anchor="middle">tools/call</text>
  <path class="dash" d="M577 471C650 471 650 495 695 495"/>
  <text class="t s" x="925" y="655" text-anchor="middle">“Server”表示协议角色；既可以在本机，也可以在远程。</text>
</svg>
