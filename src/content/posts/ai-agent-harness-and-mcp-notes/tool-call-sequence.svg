<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">一次工具调用的执行时序</title>
  <desc id="desc">用户请求交给 Harness，Harness 携带上下文和工具定义调用 LLM。LLM 返回结构化工具调用，Harness 校验后执行工具，再把结果返回 LLM。</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#486581"/></marker>
    <style>
      .t{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#1f2933}.h{font-size:25px;font-weight:700}.m{font-size:18px;font-weight:600}.s{font-size:15px;fill:#52616b}.head{fill:#eef3f6;stroke:#78909c;stroke-width:2}.life{stroke:#9aa7ad;stroke-width:1.5;stroke-dasharray:6 7}.req{stroke:#486581;stroke-width:2.4;marker-end:url(#a)}.ret{stroke:#6b7c85;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}.note{fill:#fff;stroke:#b0bac0;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="720" rx="18" fill="#fbfbfa" stroke="#d5dadd"/>
  <text class="t h" x="600" y="45" text-anchor="middle">一次 Tool Call 中，语义判断与程序执行是分开的</text>
  <g>
    <rect class="head" x="65" y="75" width="190" height="58" rx="8"/><text class="t m" x="160" y="111" text-anchor="middle">用户 / 浏览器</text>
    <rect class="head" x="355" y="75" width="190" height="58" rx="8"/><text class="t m" x="450" y="111" text-anchor="middle">Harness / 后端</text>
    <rect class="head" x="655" y="75" width="190" height="58" rx="8"/><text class="t m" x="750" y="111" text-anchor="middle">LLM</text>
    <rect class="head" x="945" y="75" width="190" height="58" rx="8"/><text class="t m" x="1040" y="111" text-anchor="middle">工具 / 环境</text>
    <path class="life" d="M160 134V675M450 134V675M750 134V675M1040 134V675"/>
  </g>
  <path class="req" d="M160 176H440"/><text class="t s" x="300" y="167" text-anchor="middle">① 用户任务</text>
  <rect class="note" x="347" y="205" width="206" height="70" rx="7"/>
  <text class="t s" x="450" y="232" text-anchor="middle">组装 Context</text><text class="t s" x="450" y="257" text-anchor="middle">附加 Tool Schemas</text>
  <path class="req" d="M460 306H740"/><text class="t s" x="600" y="297" text-anchor="middle">② 问题 + 上下文 + 工具定义</text>
  <rect class="note" x="657" y="335" width="186" height="60" rx="7"/>
  <text class="t s" x="750" y="361" text-anchor="middle">理解任务并选择工具</text><text class="t s" x="750" y="384" text-anchor="middle">生成结构化参数</text>
  <path class="ret" d="M740 426H460"/><text class="t s" x="600" y="416" text-anchor="middle">③ Tool Call {name, arguments}</text>
  <rect class="note" x="347" y="450" width="206" height="72" rx="7"/>
  <text class="t s" x="450" y="477" text-anchor="middle">查注册表 · 校验参数</text><text class="t s" x="450" y="501" text-anchor="middle">检查权限 / 审批</text>
  <path class="req" d="M460 551H1030"/><text class="t s" x="748" y="541" text-anchor="middle">④ 执行真实工具</text>
  <path class="ret" d="M1030 592H460"/><text class="t s" x="748" y="615" text-anchor="middle">⑤ Tool Result / Observation</text>
  <path class="req" d="M460 642H740"/><text class="t s" x="600" y="633" text-anchor="middle">⑥ 将结果加入下一轮上下文</text>
  <text class="t s" x="750" y="687" text-anchor="middle">LLM 决定回答、继续调用或结束本轮</text>
</svg>
