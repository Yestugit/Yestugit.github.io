<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent 系统组成</title>
  <desc id="desc">用户目标进入 Harness。Harness 组织上下文、状态、语言模型、工具注册表和执行控制，再通过工具与外部环境交互。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#4b6b8a"/></marker>
    <style>
      .t{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#1f2933}.h{font-size:25px;font-weight:700}.m{font-size:20px;font-weight:600}.s{font-size:16px;fill:#52616b}.box{fill:#fff;stroke:#8294a4;stroke-width:2}.soft{fill:#f3f6f8;stroke:#8294a4;stroke-width:2}.blue{fill:#eef4f8;stroke:#4b6b8a;stroke-width:2}.line{stroke:#4b6b8a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#fbfbfa" stroke="#d5dadd"/>
  <text class="t h" x="600" y="46" text-anchor="middle">Agent 是一个运行系统，而不只是一个语言模型</text>
  <rect class="blue" x="430" y="76" width="340" height="62" rx="8"/>
  <text class="t m" x="600" y="114" text-anchor="middle">用户目标与当前任务</text>
  <path class="line" d="M600 139V178"/>

  <rect class="soft" x="105" y="184" width="990" height="330" rx="12"/>
  <text class="t h" x="135" y="222">Agent Harness / Runtime</text>
  <text class="t s" x="1060" y="221" text-anchor="end">负责组装、约束与调度</text>

  <rect class="box" x="145" y="260" width="245" height="172" rx="9"/>
  <text class="t m" x="267" y="306" text-anchor="middle">Context / State</text>
  <text class="t s" x="267" y="342" text-anchor="middle">任务说明与历史结果</text>
  <text class="t s" x="267" y="370" text-anchor="middle">记忆、文件与环境信息</text>
  <text class="t s" x="267" y="398" text-anchor="middle">本轮可见的工具定义</text>

  <rect class="blue" x="477" y="260" width="245" height="172" rx="9"/>
  <text class="t m" x="600" y="306" text-anchor="middle">LLM</text>
  <text class="t s" x="600" y="342" text-anchor="middle">理解目标</text>
  <text class="t s" x="600" y="370" text-anchor="middle">推理并选择下一步</text>
  <text class="t s" x="600" y="398" text-anchor="middle">生成 Tool Call 或回答</text>

  <rect class="box" x="810" y="260" width="245" height="172" rx="9"/>
  <text class="t m" x="932" y="306" text-anchor="middle">Execution Control</text>
  <text class="t s" x="932" y="342" text-anchor="middle">工具注册与参数校验</text>
  <text class="t s" x="932" y="370" text-anchor="middle">权限、沙箱与用户确认</text>
  <text class="t s" x="932" y="398" text-anchor="middle">错误处理与结果回填</text>

  <path class="line" d="M393 346H469"/>
  <path class="line" d="M725 346H802"/>
  <path d="M932 433V467H600V441" fill="none" stroke="#7d8b94" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text class="t s" x="746" y="491" text-anchor="middle">Observation 回到下一轮上下文</text>

  <path class="line" d="M932 515V555"/>
  <rect class="box" x="120" y="558" width="960" height="54" rx="8"/>
  <text class="t m" x="600" y="592" text-anchor="middle">外部环境：文件系统 · Shell · 浏览器 · 数据库 · GitHub / Jira / SaaS</text>
</svg>
